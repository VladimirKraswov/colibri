server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/llm-studio.crt;
    ssl_certificate_key /etc/nginx/ssl/llm-studio.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LLMStudioSSL:10m;

    root /var/www/llm-studio;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Permissions-Policy "microphone=(self)" always;
    }

    # Persistent CPU-only GigaAM ASR used by file transcription and dictation.
    location /api/asr/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        add_header X-Accel-Buffering no always;
    }

    # Gemma 4 26B-A4B QAT Q4_0 with the multimodal projector.
    location /api/llm/gemma4/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/api/llm/(colibri|kat)/ {
        default_type application/json;
        return 410 '{"error":{"message":"This experimental model was retired; start a new Gemma 4 conversation.","type":"retired_model"}}';
    }

    # Existing llama.cpp reference engine, kept resident for direct A/B use.
    location /api/llm/legacy/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    # Backward-compatible default for clients that do not select an engine.
    location /api/llm/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    # Keep the existing root-level OpenAI-compatible API on Gemma 4.
    location ~ ^/(v1|health|props|completion|tokenize|detokenize|slots|models|lora-adapters)(/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }
}
