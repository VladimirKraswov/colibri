# KAT-Coder V2.5 Dev on Colibri, with the original llama.cpp model retained.
# Keep distinct paths so a saved conversation can never cross model boundaries.
location /api/llm/kat/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    add_header X-Accel-Buffering no always;
}

location /api/llm/legacy/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    add_header X-Accel-Buffering no always;
}

# Explicitly retire the previous Colibri model route. Returning an error is
# safer than silently sending its cached browser context to KAT-Coder.
location /api/llm/colibri/ {
    default_type application/json;
    return 410 '{"error":{"message":"The previous Colibri model was retired; start a new KAT-Coder conversation.","type":"retired_model"}}';
}
