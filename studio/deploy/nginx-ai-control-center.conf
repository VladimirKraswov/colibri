server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/ai-control-center.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-control-center.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIControlCenterSSL:10m;
    server_tokens off;
    client_max_body_size 64m;
    add_header Permissions-Policy "microphone=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Product API, including long-running SSE inference responses.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    # Compatibility routes retained for existing clients and diagnostics.
    location /api/asr/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        add_header X-Accel-Buffering no always;
    }

    location /api/llm/gemma4/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location /api/llm/legacy/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/api/llm/(colibri|kat)/ {
        default_type application/json;
        return 410 '{"error":{"message":"This experimental model was retired; start a new Gemma 4 conversation.","type":"retired_model"}}';
    }

    location /api/llm/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/(v1|health|props|completion|tokenize|detokenize|slots|models|lora-adapters)(/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    # React application and client-side routing are served by Fastify.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
